[project]
name = "proofscan"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "rfc8785>=0.1.4,<1",
  "celery[redis]>=5.5,<6",
  "langgraph>=1.0,<2",
  "opencv-python-headless>=4.11,<5",
]

[project.optional-dependencies]
agent = [
    "fastembed>=0.7,<1",
    "langfuse>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "."]
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 105

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["proofscan"]

[tool.mypy]
mypy_path = "apps/api"
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "cv2"]
ignore_missing_imports = true
